services:
  nomad-inbox:
    build: .
    image: ${NOMADINBOX_IMAGE:-nomad-inbox:latest}
    container_name: ${NOMADINBOX_CONTAINER:-nomad_inbox}
    restart: unless-stopped
    ports:
      - "${NOMADINBOX_PORT:-8150}:8080"
    environment:
      Auth__Username: ${NOMADINBOX_ADMIN_USER:-admin}
      Auth__Password: ${NOMADINBOX_ADMIN_PASSWORD:?Set NOMADINBOX_ADMIN_PASSWORD in .env}
      TZ: ${TZ:-UTC}
    volumes:
      # SQLite database + encryption keys for the stored app password. Back this up.
      - nomad-inbox-data:/data
      # Saved YouTube videos, in NOMAD's shared media folder so Jellyfin (/media/youtube) and File Browser can see them.
      - ${NOMADINBOX_VIDEO_DIR:-/opt/project-nomad/storage/media/youtube}:/videos
      # Saved pages: their images and videos, plus a plain-HTML copy, in NOMAD's File Browser ("nomad-inbox-pages").
      - ${NOMADINBOX_PAGES_DIR:-/opt/project-nomad/storage/filebrowser/files/nomad-inbox-pages}:/pages-export
    extra_hosts:
      # NOMAD's Ollama (port 11434) and Command Center (port 8080), published on the host. The default addresses
      # use their container names, which also work when NOMAD runs this app itself (Supply Depot, on NOMAD's network).
      - "nomad_ollama:host-gateway"
      - "nomad_admin:host-gateway"
      - "host.docker.internal:host-gateway"

volumes:
  nomad-inbox-data:
