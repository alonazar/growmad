# Builds and checks the Docker image on every pull request; on a version tag (git tag v1.2.3 && git push origin v1.2.3)
# also publishes it as ghcr.io/<owner>/nomad-inbox:1.2.3 (and :latest) for NOMAD's Supply Depot.
# NOMAD finds updates by these X.Y.Z tags. The package must be public (once, in its GitHub package settings).
name: Image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/NomadInbox.Tests

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: nomad-inbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Like NOMAD's Supply Depot: no setup container, and Docker creates the missing bind folders owned by root.
      - name: Smoke test
        run: |
          dir="$RUNNER_TEMP/storage"
          docker run -d --name smoke -p 8080:8080 -e Auth__Password=ci-only \
            -v "$dir/nomad-inbox:/data" -v "$dir/youtube:/videos" -v "$dir/pages:/pages-export" nomad-inbox:ci
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/health && break; sleep 2; done
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/login | grep -q 'data-skin='
          # The app runs as its own user and can write to every mounted folder.
          docker top smoke -eo pid,uid,args | awk '/NomadInbox.Web.dll/ && $2 != 0 {ok=1} END {exit !ok}'
          docker exec smoke sh -c 'setpriv --reuid="$APP_UID" --regid="$APP_UID" --clear-groups \
            sh -c "touch /videos/.ci /pages-export/.ci && test -f /data/nomad-inbox.db"'

      - name: Logs
        if: failure()
        run: docker logs smoke

      - name: Tags
        id: meta
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nomad-inbox
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
